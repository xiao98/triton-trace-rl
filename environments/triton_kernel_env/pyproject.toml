[project]
name = "triton-kernel-env"
version = "0.1.0"
description = "Triton-only KernelBench (Level 1-2): multi-turn kernel optimisation with profiler feedback, hard process isolation and anti-reward-hacking guards."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.4.1",
    "datasets>=2.19.0",
    "torch>=2.4",
    "triton>=3.0; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triton_kernel_env"]
